# ============================================================
# MathConstruct — Smoke Test: Tool Calling (ReAct mode)
# 3 problems × 3 models, 1 variation each
#
# Run:
#   $env:HF_TOKEN="<your-hf-token>"
#   uv run python src/scripts/run.py configs/smoke_test/tool.yaml
#
# ReAct mode (use_react: true) is used so all 3 models are
# treated identically — no model-specific function-calling
# quirks that could skew the comparison.
# ============================================================

test_run: false
output_dir: "smoke-tool"

# ----------------------------------------------------------------
# Models: Qwen 32B, Llama 8B, Llama 70B via Together AI
# ----------------------------------------------------------------
models:
  - "huggingface:Qwen/Qwen3-32B"
  - "huggingface:meta-llama/Llama-3.1-8B-Instruct"
  - "huggingface:meta-llama/Llama-3.3-70B-Instruct"

# ----------------------------------------------------------------
# Inference
# ----------------------------------------------------------------
inference:
  temperature: 0.7
  top_p: 0.9
  max_tokens: 4096
  concurrent_requests: 1   # Stay within Together AI free-tier rate limits
  timeout: 300

# ----------------------------------------------------------------
# Tool-calling solver (ReAct text-based — works with any model)
# ----------------------------------------------------------------
solver:
  type_solver: "tool"
  use_react: true           # Text-based ReAct loop — no native function-calling needed

  tool_timeout: 30          # seconds per tool execution
  max_tool_rounds: 6        # max ReAct iterations per problem

  parse_feedback: true
  check_feedback: false
  max_feedback_rounds: 2
  error_string: "The solution parser encountered the following error:\n{error}\nPlease format your reply accurately."
  formatting_prefix: "Format your reply as follows:"
  batch_size: 3

# ----------------------------------------------------------------
# Problems — exactly 3, one from each major category
#   bxmo-2011-1          : Number Theory  (BxMO 2011 P1)
#   dutch-2010-4         : Mixed          (Dutch MO Finals 2010 P4)
#   imo-shortlist-2018-c1: Combinatorics  (IMO SL 2018 C1)
# ----------------------------------------------------------------
problems:
  - "bxmo-2011-1"
  - "dutch-2010-4"
  - "imo-shortlist-2018-c1"

n_variations: 1
