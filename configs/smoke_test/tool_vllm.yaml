# ============================================================
# MathConstruct — Smoke Test: Tool Calling (ReAct) via local vLLM
# 3 problems, 1 variation
#
# 1. Start vLLM server (in a separate terminal):
#      vllm serve meta-llama/Llama-3.1-8B-Instruct --port 8000
#
# 2. Run benchmark:
#      $env:OPENAI_API_KEY="dummy-local"
#      uv run python src/scripts/run.py configs/smoke_test/tool_vllm.yaml
# ============================================================

test_run: false
output_dir: "smoke-tool-vllm"

models:
  - "openai:meta-llama/Llama-3.1-8B-Instruct"

inference:
  temperature: 0.7
  top_p: 0.9
  max_tokens: 4096
  concurrent_requests: 1
  timeout: 300

solver:
  type_solver: "tool"
  use_react: true
  local_api_base_url: "http://localhost:8000/v1"

  tool_timeout: 30
  max_tool_rounds: 6

  parse_feedback: true
  check_feedback: false
  max_feedback_rounds: 2
  error_string: "The solution parser encountered the following error:\n{error}\nPlease format your reply accurately."
  formatting_prefix: "Format your reply as follows:"
  batch_size: 3

problems:
  - "bxmo-2011-1"
  - "dutch-2010-4"
  - "imo-shortlist-2018-c1"

n_variations: 1
