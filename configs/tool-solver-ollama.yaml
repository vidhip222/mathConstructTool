# Tool-solver — Ollama (fully local, no API key, no internet needed)
# Install: https://ollama.com/download  (Windows installer available)
#
# Pull models first:
#   ollama pull qwen2.5:32b         # ~20GB — needs 32GB RAM or GPU VRAM
#   ollama pull llama3.2:3b         # ~2GB  — fast on any machine
#   ollama pull llama3.1:8b         # ~5GB  — good on 16GB RAM
#   ollama pull llama3.3:70b        # ~43GB — needs strong GPU or very patient CPU
#
# Start Ollama server (usually auto-starts), then:
#   python src/scripts/run.py configs/tool-solver-ollama.yaml
#
# Tip: start small — llama3.1:8b first to verify the pipeline works.

test_run: false
output_dir: "tool-solver-ollama"

models:
  - "ollama:llama3.1:8b"        # 8B — good starting point, ~5GB RAM

  # Uncomment when you have the RAM/VRAM:
  # - "ollama:qwen2.5:32b"      # ~35B equivalent — needs 32GB
  # - "ollama:llama3.3:70b"     # 70B — needs 48GB+ or very slow on CPU

solver:
  type_solver: "tool"
  parse_feedback: true
  check_feedback: false
  max_feedback_rounds: 1
  max_tool_rounds: 5
  tool_verbose: true
  formatting_prefix: "Format your reply as follows:"
  error_string: "The solution parser encountered the following error:\n{error}\nPlease format your reply accurately."

inference:
  temperature: 0.6
  top_p: 0.9
  max_tokens: 4000
  concurrent_requests: 1    # local inference — one at a time
  timeout: 600              # local models are slower, give them more time

problems:
  - "tot-2005.*"   # single problem class, 3 variations

n_variations: 3
