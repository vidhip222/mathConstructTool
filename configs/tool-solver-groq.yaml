# Tool-solver — Groq free tier (no credit card needed)
# Sign up: https://console.groq.com
# Then: set GROQ_API_KEY=your_key
#
# Run: python src/scripts/run.py configs/tool-solver-groq.yaml

test_run: false
output_dir: "tool-solver-groq"

models:
  - "groq:qwen/qwen3-32b"            # Qwen3 32B
  - "groq:llama-3.1-8b-instant"      # Llama 8B  (fastest on Groq)
  - "groq:llama-3.3-70b-versatile"   # Llama 70B

solver:
  type_solver: "tool"
  parse_feedback: true
  check_feedback: false
  max_feedback_rounds: 1
  max_tool_rounds: 5
  tool_verbose: true
  formatting_prefix: "Format your reply as follows:"
  error_string: "The solution parser encountered the following error:\n{error}\nPlease format your reply accurately."

inference:
  temperature: 0.6      # Groq recommends lower temp for QwQ reasoning
  top_p: 0.9
  max_tokens: 8000      # bump to 16000 for QwQ (it thinks a lot)
  concurrent_requests: 1    # Groq free tier: 6000 TPM — serialize to avoid 413s
  timeout: 300

problems:
  - "tot-2005.*"   # single problem class, 3 variations = exactly 3 problems

n_variations: 3
