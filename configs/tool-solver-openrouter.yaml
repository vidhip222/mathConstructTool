# Tool-solver — OpenRouter free tier (already supported, zero code changes)
# Sign up: https://openrouter.ai  — free credits on signup, ":free" models cost $0
# Then: set OPENROUTER_API_KEY=your_key
#
# Run: python src/scripts/run.py configs/tool-solver-openrouter.yaml
#
# NOTE: ":free" models have rate limits (20 req/min). Set concurrent_requests: 1
# and keep n_variations small. Check current free models at:
#   https://openrouter.ai/models?supported_parameters=tools&order=pricing-asc

test_run: false
output_dir: "tool-solver-openrouter"

models:
  - "openrouter:qwen/qwq-32b:free"                    # Qwen ~35B
  - "openrouter:meta-llama/llama-3.1-8b-instruct:free" # Llama 8B
  - "openrouter:meta-llama/llama-3.3-70b-instruct:free" # Llama 70B

solver:
  type_solver: "tool"
  parse_feedback: true
  check_feedback: false
  max_feedback_rounds: 1
  max_tool_rounds: 5
  tool_verbose: true
  formatting_prefix: "Format your reply as follows:"
  error_string: "The solution parser encountered the following error:\n{error}\nPlease format your reply accurately."

inference:
  temperature: 1.0
  top_p: 0.9
  max_tokens: 8000
  concurrent_requests: 1    # free tier is rate-limited, keep this at 1
  timeout: 300

problems:
  - "tot.*"

n_variations: 1
