# ============================================================
# MathConstruct — PACE HPC: Llama 3.1 8B + Tool (ReAct)
# ============================================================

test_run: False
output_dir: "llama8b-tool-run"

models:
  - "openai:meta-llama/Llama-3.1-8B-Instruct"

inference:
  temperature: 0.7
  top_p: 0.9
  max_tokens: 4096
  concurrent_requests: 1
  timeout: 600

solver:
  type_solver: "tool"
  use_react: True          # ReAct mode — works with any model, no special vLLM flags needed
  local_api_base_url: "http://localhost:8000/v1"
  tool_timeout: 30
  max_tool_rounds: 6
  parse_feedback: True
  check_feedback: False
  max_feedback_rounds: 2
  error_string: "The solution parser encountered the following error:\n{error}\nPlease format your reply accurately."
  formatting_prefix: "Format your reply as follows:"
  batch_size: 5

problems:
  - ".*"

n_variations: 2
