# ReAct tool-calling — Llama 3.1 8B via Ollama (local, CPU-friendly, free)
#
# Setup (one time):
#   1. Install Ollama: https://ollama.com  (Windows installer)
#   2. Pull model:  ollama pull llama3.1:8b
#   3. Start server: ollama serve          (runs on port 11434)
#
# Run:
#   uv run python src/scripts/run.py configs/local/tool_ollama.yaml
#
# Tools active for these 3 problems:
#   bxmo-2011-1      (Number Theory)  -> run_z3, run_sympy, run_cryptominisat, run_python
#   dutch-2010-4     (Number Theory)  -> run_z3, run_sympy, run_cryptominisat, run_python
#   imo-shortlist-2018-c1 (Combinatorics) -> run_ortools, run_z3, run_networkx, run_python

test_run: false
output_dir: "local-tool-llama8b"

models:
  - "openai:llama3.1:8b"

inference:
  temperature: 0.7
  top_p: 0.9
  max_tokens: 4096
  concurrent_requests: 1
  timeout: 600

solver:
  type_solver: "tool"
  use_react: true          # ReAct = text-based, works with ANY model (no native tool-call support needed)
  local_api_base_url: "http://localhost:11434/v1"
  tool_timeout: 30
  max_tool_rounds: 6
  parse_feedback: true
  check_feedback: false
  max_feedback_rounds: 2
  error_string: "The solution parser encountered the following error:\n{error}\nPlease format your reply accurately."
  formatting_prefix: "Format your reply as follows:"
  batch_size: 3

problems:
  - "bxmo-2011-1"
  - "dutch-2010-4"
  - "imo-shortlist-2018-c1"

n_variations: 1
