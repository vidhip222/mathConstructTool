# ============================================================
# MathConstruct — PACE HPC run with Llama 3.3 70B + Tool Calling
# ============================================================
#
# Run command (from project root on PACE login/compute node):
#
#   uv run python src/scripts/run.py configs/pace_llama_tools.yaml
#
# Prerequisites:
#   1. vLLM server is running on the GPU node (see pace/run_vllm_server.sh)
#   2. VLLM_BASE_URL env var is set, e.g.:
#        export VLLM_BASE_URL=http://<gpu-node-hostname>:8000/v1
#   3. All solver tools are installed (see pace/setup_env.sh)
# ============================================================

test_run: False
output_dir: "llama-tools-run"

# ----------------------------------------------------------------
# Model: Llama 3.3 70B via local vLLM endpoint (OpenAI-compat API)
# ----------------------------------------------------------------
models:
  - "openai:meta-llama/Llama-3.3-70B-Instruct"

# ----------------------------------------------------------------
# Inference settings
# ----------------------------------------------------------------
inference:
  temperature: 0.6        # Slight creativity — tool calls benefit from this
  top_p: 0.9
  max_tokens: 4096
  concurrent_requests: 1  # Single request at a time for local vLLM
  timeout: 600            # 10 min per request (tool rounds take time)

# ----------------------------------------------------------------
# Tool-calling solver
# ----------------------------------------------------------------
solver:
  type_solver: "tool"

  # vLLM endpoint — override with $VLLM_BASE_URL at runtime if needed
  local_api_base_url: "http://localhost:8000/v1"

  # Tool calling mode:
  #   use_react: False  → native OpenAI function-calling (requires vLLM
  #                        started with --enable-auto-tool-choice)
  #   use_react: True   → ReAct text-based tool calling (works with ANY model,
  #                        no special vLLM flags needed)
  use_react: False

  # Tool execution
  tool_timeout: 30         # seconds per tool call
  max_tool_rounds: 6       # max LLM ↔ tool turns (also max ReAct iterations)

  # Parse feedback (re-prompt if answer format is wrong)
  parse_feedback: True
  check_feedback: False
  max_feedback_rounds: 2
  error_string: "The solution parser encountered the following error:\n{error}\nPlease format your reply accurately."
  formatting_prefix: "Format your reply as follows:"

  batch_size: 5            # problems per batch (keep low for memory)

# ----------------------------------------------------------------
# Problems — run all benchmark problems
# ----------------------------------------------------------------
problems:
  - ".*"           # All problems

n_variations: 2    # 2 parameter variations per problem
