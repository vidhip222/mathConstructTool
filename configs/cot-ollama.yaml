# CoT solver — Ollama (no tool calling, plain chain-of-thought)
# Run: python src/scripts/run.py configs/cot-ollama.yaml

test_run: false
output_dir: "cot-ollama"

models:
  - "ollama:llama3.1:8b"

solver:
  type_solver: "CoT"
  parse_feedback: true
  check_feedback: false
  max_feedback_rounds: 1
  formatting_prefix: "Format your reply as follows:"
  error_string: "The solution parser encountered the following error:\n{error}\nPlease format your reply accurately."

inference:
  temperature: 1.0
  top_p: 0.9
  max_tokens: 4000
  concurrent_requests: 1
  timeout: 600

problems:
  - "tot-2005.*"

n_variations: 3
